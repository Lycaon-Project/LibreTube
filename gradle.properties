# ============================================================================
# LibreTube Gradle Properties - Ubdated for Performance
# ============================================================================

# ----------------------------------------------------------------------------
# JVM CONFIGURATION (Critical for build performance)

# Allocate 6GB RAM for Gradle daemon (LibreTube is a large project)
# Use G1 garbage collector for better performance with large heaps
# Enable string deduplication to reduce memory usage
# Enable JIT compiler optimizations
org.gradle.jvmargs=-Xmx6g \
  -XX:+UseG1GC \
  -XX:+ParallelRefProcEnabled \
  -XX:+UseStringDeduplication \
  -XX:MaxMetaspaceSize=512m \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8

# ----------------------------------------------------------------------------
# GRADLE BUILD OPTIMIZATIONS

# Enable parallel execution of independent tasks
org.gradle.parallel=true

# Enable Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Enable build caching to reuse outputs from previous builds
org.gradle.caching=true

# Enable configuration cache for faster build configuration
# This caches the result of the configuration phase
org.gradle.configuration-cache=true

# Warn on configuration cache problems instead of failing
# Allows incremental migration to full configuration cache support
org.gradle.unsafe.configuration-cache-problems=warn

# Enable build scan for performance analysis (optional, uncomment to enable)
# org.gradle.scan=true

# ----------------------------------------------------------------------------
# KOTLIN COMPILATION

# Use official Kotlin code style
kotlin.code.style=official

# Enable incremental compilation for faster rebuilds
kotlin.incremental=true

# Enable incremental compilation for Kotlin Multiplatform
kotlin.incremental.multiplatform=true

# Use Kotlin daemon for compilation (faster than in-process)
kotlin.daemon.jvmargs=-Xmx3g

# ----------------------------------------------------------------------------
# ANDROID BUILD

# Use AndroidX libraries (required for modern Android development)
android.useAndroidX=true

# Use non-transitive R classes for faster builds and smaller APKs
# Each module only sees its own resources
android.nonTransitiveRClass=true

# Use non-final resource IDs for faster incremental builds
# Allows R8 to optimize resource references
android.nonFinalResIds=true

# Disable new DSL to avoid deprecation warnings in AGP 9+
# The old DSL is still fully functional and stable
android.newDsl=false

# Enable Jetifier to convert support library to AndroidX (if needed)
# Set to false if you don't use any old support library dependencies
android.enableJetifier=false

# Enable R8 full mode for more aggressive optimizations
# Results in smaller APK but requires thorough testing
android.enableR8.fullMode=true

# Enable resource optimizations
android.enableResourceOptimizations=true

# Disable automatic SDK download (assumes SDK is already installed)
# Speeds up CI/CD builds
android.builder.sdkDownload=false

# ----------------------------------------------------------------------------
# TWEAKS

# Increase the number of workers for parallel compilation
# Adjust based on your CPU cores (default is number of CPU cores)
# org.gradle.workers.max=8

# Enable file system watching for faster incremental builds
org.gradle.vfs.watch=true

# Enable file system watching on Windows (if applicable)
# org.gradle.vfs.watch.windows=true

# Reduce memory usage during configuration phase
org.gradle.configureondemand=false

# ----------------------------------------------------------------------------
# DEBUGGING & DIAGNOSTICS

# Show more detailed output during builds (uncomment for debugging)
# org.gradle.logging.level=info

# Generate build scans for performance analysis (uncomment to enable)
# org.gradle.scan=true

# Enable profile reporting (uncomment to analyze build performance)
# org.gradle.profile=true

# macOS (exemple)
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home

